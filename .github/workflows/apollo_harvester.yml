name: Prospector-AI Apollo Harvester

on:
  workflow_dispatch:
    inputs:
      company:
        description: 'Target company domain(s) (e.g. sarvam.ai or stripe.com, upman.in)'
        required: true
        type: string
        default: 'sarvam.ai'
      department:
        description: 'Primary Department Target'
        required: true
        type: choice
        options:
          - all
          - c_suite
          - human_resources
          - engineering_technical
          - sales
          - marketing
          - product
          - operations
          - finance
          - information_technology
          - design
          - legal
          - medical_health
          - education
          - consulting
        default: 'c_suite'
      custom_departments:
        description: 'Optional Multi-Department Override (comma-separated, e.g. c_suite,hr,engineering)'
        required: false
        type: string
        default: ''
      seniority:
        description: 'Seniority Level Target'
        required: true
        type: choice
        options:
          - all
          - c_suite
          - founder
          - head
          - director
          - vp
          - manager
          - senior
        default: 'all'
      output_format:
        description: 'Output format'
        required: true
        type: choice
        options:
          - csv
          - json
          - table
        default: 'csv'
      max_leads:
        description: 'Max leads per company'
        required: false
        type: string
        default: '15'
      no_smtp:
        description: 'Disable raw TCP port 25 SMTP check (Recommended on cloud runners)'
        required: false
        type: boolean
        default: true

jobs:
  apollo_prospect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Apollo Harvest & OSINT Unmasking
        env:
          APOLLO_API_KEYS: ${{ secrets.APOLLO_API_KEYS }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          APOLLO_API_KEY_1: ${{ secrets.APOLLO_API_KEY_1 }}
          APOLLO_API_KEY_2: ${{ secrets.APOLLO_API_KEY_2 }}
          APOLLO_API_KEY_3: ${{ secrets.APOLLO_API_KEY_3 }}
          APOLLO_API_KEY_4: ${{ secrets.APOLLO_API_KEY_4 }}
          APOLLO_API_KEY_5: ${{ secrets.APOLLO_API_KEY_5 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.no_smtp }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-smtp"
          fi

          # Resolve departments argument
          if [ -n "${{ inputs.custom_departments }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --departments ${{ inputs.custom_departments }}"
          elif [ "${{ inputs.department }}" != "all" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --departments ${{ inputs.department }}"
          fi

          # Resolve seniorities argument
          if [ "${{ inputs.seniority }}" != "all" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --seniorities ${{ inputs.seniority }}"
          fi

          python -m prospector.cli "${{ inputs.company }}" \
            --format "${{ inputs.output_format }}" \
            --output "prospects.${{ inputs.output_format }}" \
            --max-leads "${{ inputs.max_leads }}" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --verbose \
            $EXTRA_ARGS

      - name: Upload Lead Artifact
        if: inputs.output_format != 'table'
        uses: actions/upload-artifact@v4
        with:
          name: apollo-lead-results
          path: prospects.${{ inputs.output_format }}

      - name: Display Summary Info
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🎯 **Apollo Roster Harvester**: Verified contact profiles discovered with automated last-name unmasking & MX deliverability checks." >> $GITHUB_STEP_SUMMARY
          echo "> 📦 **Download Artifact**: CSV/JSON files are downloadable directly from the Actions artifact panel above." >> $GITHUB_STEP_SUMMARY
