name: Prospector-AI Zero-Config OSINT Harvester

on:
  workflow_dispatch:
    inputs:
      company:
        description: 'Target company domain(s) (e.g. stripe.com or rkhrm.com, upman.in), name, or LinkedIn URL'
        required: true
        type: string
        default: 'rkhrm.com'
      roles:
        description: 'Target Decision-Maker Personas'
        required: true
        type: choice
        options:
          - all
          - c-suite
          - hr
        default: 'all'
      location:
        description: 'Optional Geographic Location Filter (e.g. India, USA, London, Bengaluru)'
        required: false
        type: string
        default: ''
      output_format:
        description: 'Output format'
        required: true
        type: choice
        options:
          - csv
          - json
          - table
        default: 'csv'
      max_leads:
        description: 'Max leads per role'
        required: false
        type: string
        default: '10'
      no_smtp:
        description: 'Disable raw TCP port 25 SMTP check (Recommended on cloud runners)'
        required: false
        type: boolean
        default: true

jobs:
  osint_prospect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Zero-Config OSINT Pipeline (No API Keys Required)
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          CMD=(python -m prospector.cli "${{ inputs.company }}" \
            --roles "${{ inputs.roles }}" \
            --format "${{ inputs.output_format }}" \
            --output "prospects.${{ inputs.output_format }}" \
            --max-leads "${{ inputs.max_leads }}" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --verbose)

          if [ "${{ inputs.no_smtp }}" = "true" ]; then
            CMD+=(--no-smtp)
          fi
          if [ -n "${{ inputs.location }}" ]; then
            CMD+=(--location "${{ inputs.location }}")
          fi

          "${CMD[@]}"

      - name: Upload Lead Artifact
        if: inputs.output_format != 'table'
        uses: actions/upload-artifact@v4
        with:
          name: osint-lead-results
          path: prospects.${{ inputs.output_format }}

      - name: Display Summary Info
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🌐 **Zero-Config OSINT Harvester**: Discovered via passive search engine indexes (100% Free, Zero API Keys, Unlimited Runs)." >> $GITHUB_STEP_SUMMARY
          echo "> 📦 **Download Artifact**: CSV/JSON files are downloadable directly from the Actions artifact panel above." >> $GITHUB_STEP_SUMMARY
